name: bodygrind
description: BodyGrind fitness tracker with 3D Muscle Anatomy.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # 3D Model Viewer & Controller
  flutter_3d_controller: ^2.2.0

  # State Management & Routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Firebase
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0

  # Local Database & Storage
  drift: ^2.22.1
  path_provider: ^2.1.5
  path: ^1.9.0
  shared_preferences: ^2.3.3

  # UI, Charts, Scanner, Notifications & AI
  fl_chart: ^0.69.2
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  google_generative_ai: ^0.4.6
  image_picker: ^1.1.2
  intl: ^0.20.1
  mobile_scanner: ^6.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.22.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/models/
